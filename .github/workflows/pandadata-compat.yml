name: Pandadata compatibility
on:
  workflow_call:
    inputs:
      contract-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: quantskills/skill-pandadata-api
          ref: ${{ inputs.contract-ref }}
          path: .pandadata-contract
          persist-credentials: false
      - name: Check consumer contract without credentials
        run: python .pandadata-contract/scripts/check_sdk_contract.py --root . --contract .pandadata-contract/references/sdk-contract.json
